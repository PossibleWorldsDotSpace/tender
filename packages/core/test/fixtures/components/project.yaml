page-templates:
  default: { size: A5, margin: { top: 12mm, bottom: 12mm, inner: 12mm, outer: 12mm } }
components:
  callout:
    tag: aside
    class: callout
    attrs: [variant]
templates:
  row:
    params: [label]
    template: |
      <div class="row">
        <div class="col-l">{{#if label}}<span>{{label}}</span>{{/if}}</div>
        <div class="col-r">{{{body}}}</div>
      </div>
