page-templates:
  default:
    size: A5
    margin: { top: 18mm, bottom: 20mm, inner: 18mm, outer: 14mm }
    headers:
      left: "{chapter}"
      right: "{page}"
  chapter-opener:
    size: A5
    margin: { top: 30mm, bottom: 20mm, inner: 18mm, outer: 14mm }
    headers: none
    headers-rest:
      left: "{chapter}"
      right: "{page}"
