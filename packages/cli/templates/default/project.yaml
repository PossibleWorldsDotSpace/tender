page-templates:
  default:
    size: A5
    margin: { top: 18mm, bottom: 20mm, inner: 18mm, outer: 14mm }
    headers:
      left: "{chapter}"
      right: "{page}"
  chapter-opener:
    size: A5
    margin: { top: 30mm, bottom: 20mm, inner: 18mm, outer: 14mm }
    headers: none
    headers-rest:
      left: "{chapter}"
      right: "{page}"

typography:
  lang: en
  hyphenation:
    enabled: true
    min-word-length: 6
    min-chars-before: 3
    min-chars-after: 3

components:
  callout:
    tag: aside
    class: callout
    attrs: [variant]

templates:
  row:
    params: [label]
    template: |
      <div class="row">
        <div class="col-l">{{#if label}}<span class="margin-label">{{label}}</span>{{/if}}</div>
        <div class="col-r">{{{body}}}</div>
      </div>
